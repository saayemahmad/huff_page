<title>পাখির বাসা</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: one bright aqua sky scene. Wide screens stack bubble, bird and glass card. Phones put the bird beside its bubble so everything fits one screen. */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --sky-top: #2a9fe4;
  --sky-mid: #7fd6f4;
  --sky-low: #d6f4fd;
  --ink: #0a3b5a;
  --ink-soft: #1d5a80;
  --sun: #e85d04;
  --sun-deep: #b83200;
  --font-display: "Baloo Da 2", "Hind Siliguri", "Noto Sans Bengali", "Kalpurush", sans-serif;
  --font-body: "Hind Siliguri", "Noto Sans Bengali", "Kalpurush", sans-serif;
  color-scheme: light;
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; }
body {
  background: var(--sky-low);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
}

.scene {
  position: relative;
  min-height: 100%;
  overflow: hidden;
  display: flex; flex-direction: column; justify-content: center;
  padding-block: 20px clamp(96px, 20svh, 200px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(60% 40% at 10% 0%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%),
    radial-gradient(40% 30% at 92% 8%, rgba(255,255,255,.4), rgba(255,255,255,0) 70%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 82%);
}

/* sky decoration */
.cloud {
  position: absolute; z-index: 0;
  left: var(--x); top: var(--y);
  width: var(--w); height: calc(var(--w) * .3);
  background: #fff; border-radius: 999px; opacity: .92;
  filter: drop-shadow(0 10px 8px rgba(0,110,180,.18));
}
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 42%; height: 130%; left: 14%; bottom: 30%; }
.cloud::after { width: 32%; height: 100%; left: 50%; bottom: 35%; }

.bubble {
  position: absolute; z-index: 0;
  left: var(--x); top: var(--y);
  width: var(--s); height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.95) 0 7%, rgba(255,255,255,.28) 24%, rgba(120,215,255,.14) 62%, rgba(255,255,255,.55) 100%);
  border: 1px solid rgba(255,255,255,.75);
  box-shadow: inset 0 -6px 12px rgba(255,255,255,.35), 0 6px 16px rgba(0,100,170,.2);
  animation: drift var(--d) ease-in-out infinite alternate;
}
@keyframes drift { from { transform: translate(0, 0); } to { transform: translate(10px, -20px); } }

.hill {
  position: absolute; z-index: 1; left: 0; right: 0; bottom: 0;
  width: 100%; height: clamp(110px, 24svh, 240px);
  display: block;
}

/* stage */
.stage {
  position: relative; z-index: 2;
  width: 100%; max-width: 640px; margin-inline: auto;
  display: flex; flex-direction: column; align-items: center;
}
.top {
  position: relative; z-index: 3;
  width: 100%;
  display: flex; flex-direction: column; align-items: center;
  margin-bottom: -30px;
}
.bird-wrap {
  position: relative;
  width: min(250px, 62vw);
  filter: drop-shadow(0 10px 8px rgba(0,60,110,.25));
}
.bird { display: block; width: 100%; height: auto; overflow: visible; }
.bird-body { transform-origin: 130px 150px; }
.puff { opacity: .92; transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 2px 2px rgba(0,100,170,.35)); animation: puff 2.6s ease-out infinite; animation-delay: -1.1s; }
.puff.r { --dx: 10px; animation-delay: -.2s; }
.puff.l { --dx: -10px; }
@keyframes puff {
  0% { transform: translate(0, 8px) scale(.7); opacity: 0; }
  35% { opacity: .95; }
  100% { transform: translate(var(--dx), -18px) scale(1.2); opacity: 0; }
}
.huff .bird-body { animation: puffUp .7s ease-out; }
.huff .puff { animation-duration: .8s; }
.huff .msg { animation: wobble .55s ease-out; }
@keyframes puffUp {
  0% { transform: scale(1) rotate(0); }
  30% { transform: scale(1.1) rotate(-2.5deg); }
  55% { transform: scale(1.1) rotate(2.5deg); }
  80% { transform: scale(1.04) rotate(-1deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes wobble {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(2px); }
}

/* speech bubble beside the bird's head */
.say {
  position: relative; z-index: 4;
  width: min(100%, 360px);
  margin-bottom: 18px;
  padding: 12px 20px 14px;
  border-radius: 22px;
  text-align: center;
  font-weight: 600; font-size: 1.05rem; line-height: 1.6;
  color: var(--ink);
  text-shadow: 0 1px 0 rgba(255,255,255,.85);
  background: linear-gradient(180deg, #ffffff 0%, #eafaff 50%, #cdeffb 100%);
  border: 1px solid #fff;
  box-shadow: 0 10px 22px rgba(0,80,140,.3), inset 0 1px 0 #fff, inset 0 -3px 6px rgba(0,140,210,.22);
  transform-origin: 50% 100%;
  animation: sayPop .7s cubic-bezier(.34,1.56,.64,1) both;
}
.say::before {
  content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 44%;
  border-radius: 18px 18px 50% 50% / 18px 18px 40% 40%;
  background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.1));
  pointer-events: none;
}
.say::after {
  content: ""; position: absolute; left: 50%; bottom: -9px;
  width: 18px; height: 18px; margin-left: -9px;
  transform: rotate(45deg);
  background: #cdeffb;
  border-right: 1px solid #fff; border-bottom: 1px solid #fff;
  border-bottom-right-radius: 4px;
  box-shadow: 4px 4px 8px rgba(0,80,140,.2);
}
.say p { position: relative; margin: 0; text-wrap: balance; }
@keyframes sayPop { from { transform: scale(.4); } to { transform: scale(1); } }
@keyframes sayBounce {
  0%, 100% { transform: scale(1) translateY(0); }
  40% { transform: scale(1.06) translateY(-4px); }
}
.huff .say { animation: sayBounce .5s ease-out; }

/* glass shelf */
.card {
  position: relative; width: 100%;
  padding: 50px clamp(18px, 5vw, 34px) 24px;
  border-radius: 28px;
  background: linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.34) 52%, rgba(206,243,255,.5) 100%);
  -webkit-backdrop-filter: blur(14px) saturate(1.5);
  backdrop-filter: blur(14px) saturate(1.5);
  border: 1px solid rgba(255,255,255,.95);
  box-shadow:
    0 24px 50px rgba(0,80,140,.35),
    0 2px 0 rgba(255,255,255,.7),
    inset 0 1px 0 #fff,
    inset 0 -3px 8px rgba(0,130,210,.28);
}
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 46%;
  border-radius: 27px 27px 60% 60% / 27px 27px 22px 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,.1));
  pointer-events: none;
}
.card::after {
  content: ""; position: absolute; left: 7%; right: 7%; top: 100%; height: 44px; margin-top: 8px;
  border-radius: 0 0 40px 40px;
  background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));
  filter: blur(2px);
  pointer-events: none;
}
.card > * { position: relative; }

.tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.pill {
  position: relative; overflow: hidden;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 16px 6px; border-radius: 999px;
  font-family: var(--font-body); font-weight: 600; font-size: .95rem; line-height: 1.5;
}
.pill::before {
  content: ""; position: absolute; left: 6px; right: 6px; top: 2px; height: 46%;
  border-radius: 999px 999px 50% 50% / 999px 999px 40% 40%;
  background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.1));
  pointer-events: none;
}
.pill > * { position: relative; }
.pill.aqua {
  color: var(--ink);
  background: linear-gradient(180deg, #d7f6ff 0%, #8fe0fa 50%, #54c8f0 51%, #9be6fb 100%);
  border: 1px solid #3aa6d4;
  box-shadow: 0 2px 5px rgba(0,100,160,.3), inset 0 -2px 4px rgba(255,255,255,.4);
  text-shadow: 0 1px 0 rgba(255,255,255,.7);
}
.pill.red {
  color: #fff;
  background: linear-gradient(180deg, #ff8a7a 0%, #e8402f 50%, #c91f12 51%, #e8503f 100%);
  border: 1px solid #9c1409;
  box-shadow: 0 2px 5px rgba(150,20,10,.4), inset 0 -2px 4px rgba(255,255,255,.2);
  text-shadow: 0 -1px 0 rgba(90,0,0,.55);
}
.pill .ban { width: 14px; height: 14px; flex: none; }

.msg {
  margin: 20px 0 24px; text-align: center;
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(1.7rem, 5.6vw, 2.9rem); line-height: 1.5;
  text-wrap: balance;
  color: var(--ink);
  text-shadow: 0 1px 0 rgba(255,255,255,.9), 0 3px 8px rgba(255,255,255,.55);
}
.hot {
  background: linear-gradient(180deg, var(--sun) 0%, var(--sun-deep) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 1px 0 rgba(255,255,255,.8));
}

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; }
.gel {
  position: relative; overflow: hidden; flex: none;
  min-width: 128px; padding: 8px 30px 10px;
  border-radius: 999px; border: 1px solid #a33b00; cursor: pointer;
  font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; line-height: 1.5;
  color: #fff; text-shadow: 0 -1px 0 rgba(110,30,0,.7);
  background: linear-gradient(180deg, #ffa43a 0%, #f2791a 49%, #dc5200 50%, #f27d1c 100%);
  box-shadow: 0 5px 12px rgba(180,70,0,.45), 0 1px 0 rgba(255,255,255,.6), inset 0 1px 0 rgba(255,255,255,.8), inset 0 -3px 6px rgba(255,255,255,.25);
  transition: transform .08s ease, box-shadow .12s ease, filter .12s ease;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.gel::before {
  content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 46%;
  border-radius: 999px 999px 50% 50% / 999px 999px 40% 40%;
  background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.14));
  pointer-events: none;
}
.gel span { position: relative; }
@media (hover: hover) {
  .gel:hover { filter: brightness(1.07); box-shadow: 0 5px 16px rgba(255,140,30,.7), 0 1px 0 rgba(255,255,255,.6), inset 0 1px 0 rgba(255,255,255,.85), inset 0 -3px 6px rgba(255,255,255,.3); }
}
.gel:active { transform: translateY(2px); box-shadow: 0 1px 3px rgba(180,70,0,.5), inset 0 3px 8px rgba(110,30,0,.45); filter: brightness(.97); }
.gel:focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 6px var(--ink), 0 5px 12px rgba(180,70,0,.45); }

.gauge { flex: 1 1 180px; min-width: 0; display: grid; gap: 7px; }
.gauge-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 10px; font-weight: 500; font-size: 1rem; line-height: 1.5; color: var(--ink-soft); text-shadow: 0 1px 0 rgba(255,255,255,.85); }
.gauge-top strong { color: var(--sun-deep); font-weight: 600; }
.slot {
  --lvl: 70%;
  height: 22px; padding: 3px; border-radius: 999px; overflow: hidden;
  background: linear-gradient(180deg, #a3cadc, #e6f7fd);
  box-shadow: inset 0 3px 6px rgba(0,50,90,.45), inset 0 -1px 0 #fff, 0 1px 0 rgba(255,255,255,.95);
}
.fill {
  position: relative; height: 100%; width: var(--lvl); border-radius: 999px;
  background: linear-gradient(180deg, #ffb95f 0%, #f27c16 50%, #d9480a 51%, #f48c2c 100%);
  box-shadow: 0 0 10px rgba(240,100,10,.55), inset 0 -1px 2px rgba(255,255,255,.4);
  transition: width .4s cubic-bezier(.3,1.4,.5,1);
}
.fill::after {
  content: ""; position: absolute; left: 4px; right: 4px; top: 1px; height: 42%;
  border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.1));
}

.sig {
  margin: 22px 0 0; text-align: right;
  font-weight: 500; font-size: 1.1rem; line-height: 1.6; color: var(--ink-soft);
  text-shadow: 0 1px 0 rgba(255,255,255,.85);
}

/* phones and short landscape screens: bird sits left, bubble points at its head, card tightens up */
@media (max-width: 560px), (max-height: 520px) {
  .scene { padding-block: 14px clamp(84px, 15svh, 150px); }
  .hill { height: clamp(90px, 16svh, 150px); }
  .top { flex-direction: row; align-items: flex-start; justify-content: center; gap: 14px; margin-bottom: -14px; }
  .bird-wrap { order: 1; flex: none; width: clamp(112px, 34vw, 150px); }
  .say {
    order: 2; flex: 1 1 0; min-width: 0; width: auto;
    margin: 4px 0 0; padding: 10px 14px 12px;
    border-radius: 20px; font-size: .95rem; line-height: 1.55;
    text-align: left; transform-origin: 0% 25%;
  }
  .say p { text-wrap: pretty; }
  .say::after {
    left: -9px; bottom: auto; top: 26px; margin-left: 0;
    border-right: 0; border-bottom: 1px solid #fff; border-left: 1px solid #fff;
    border-bottom-right-radius: 0; border-bottom-left-radius: 4px;
    box-shadow: -4px 4px 8px rgba(0,80,140,.2);
  }
  .card { padding: 30px 16px 16px; border-radius: 24px; }
  .card::before { border-radius: 23px 23px 60% 60% / 23px 23px 20px 20px; }
  .card::after { height: 30px; }
  .tags { gap: 8px; }
  .pill { font-size: .88rem; padding: 3px 12px 4px; }
  .msg { margin: 12px 0 16px; font-size: clamp(1.45rem, 7.2vw, 2rem); line-height: 1.45; }
  .controls { flex-wrap: nowrap; gap: 12px; }
  .gel { min-width: 0; padding: 5px 20px 7px; font-size: 1.3rem; }
  .gauge { flex: 1 1 0; }
  .gauge-top { font-size: .9rem; }
  .slot { height: 20px; }
  .sig { margin-top: 10px; font-size: .95rem; line-height: 1.5; }
}
@media (max-width: 340px) {
  .controls { flex-wrap: wrap; }
  .gauge { flex-basis: 140px; }
  .say { font-size: .9rem; padding: 8px 12px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

            <path d="M22 152 C40 144 70 152 130 156 C190 152 220 144 238 152" stroke="rgba(255,232,190,.65)" stroke-width="2"/>
          </g>
        </svg>
      </div>
    </div>

    <article class="card">
      <div class="tags">
        <span class="pill aqua"><span>পাখির বাসা</span></span>
        <span class="pill red">
          <svg class="ban" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="#fff" stroke-width="2"/><path d="M3.8 12.2 12.2 3.8" stroke="#fff" stroke-width="2"/></svg>
          <span>প্রবেশ নিষেধ</span>
        </span>
      </div>

      <h1 class="msg">এই পাখির বাসার আশেপাশেও যেন <span class="hot">দ্বিতীয়বার</span> তোমায় না দেখি।</h1>

      <div class="controls">
        <button class="gel" id="huff" type="button"><span>হুঁহ!</span></button>
        <div class="gauge">
          <div class="gauge-top"><span>রাগের মাত্রা</span><strong id="mood" aria-live="polite">রেগে আছে</strong></div>
          <div class="slot" id="meter" role="meter" aria-label="রাগের মাত্রা" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><div class="fill"></div></div>
        </div>
      </div>

      <p class="sig">— ইতি, বাসার মালিক পাখি</p>
    </article>
  </section>
</main>

<script>
(function () {
  var stage = document.getElementById('stage');
  var btn = document.getElementById('huff');
  var meter = document.getElementById('meter');
  var mood = document.getElementById('mood');
  var lvl = 70, timer;
  function words(n) {
    if (n >= 100) return 'ফেটে পড়বে!';
    if (n >= 85) return 'খুব রেগে আছে';
    if (n >= 60) return 'রেগে আছে';
    return 'একটু ঠান্ডা হয়েছে';
  }
  function render() {
    meter.style.setProperty('--lvl', lvl + '%');
    meter.setAttribute('aria-valuenow', String(lvl));
    mood.textContent = words(lvl);
  }
  btn.addEventListener('click', function () {
    lvl = lvl >= 100 ? 40 : Math.min(100, lvl + 10);
    render();
    stage.classList.remove('huff');
    void stage.offsetWidth;
    stage.classList.add('huff');
    clearTimeout(timer);
    timer = setTimeout(function () { stage.classList.remove('huff'); }, 800);
  });
})();
</script>
